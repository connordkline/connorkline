
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | Connor Kline</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: #eaf2ff;
            background-color: #081426;
            background-image:
                linear-gradient(rgba(65, 130, 200, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(65, 130, 200, 0.08) 1px, transparent 1px);
            background-size: 35px 35px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            padding: 48px 30px;
            border: 1px solid #263d5c;
            border-radius: 20px;
            background: rgba(12, 29, 52, 0.95);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 58px;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            color: #72b7ff;
            border: 1px solid #315b86;
            background: #142e4c;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 48px);
            margin-bottom: 18px;
            letter-spacing: -1px;
        }

        p {
            color: #afc1d8;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        .accent {
            color: #72b7ff;
        }

        .button {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 8px;
            background: #287bd1;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: #4095ed;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            color: #7188a5;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon" aria-hidden="true">⚙️</div>

        <div class="status">CURRENTLY IN DEVELOPMENT</div>

        <h1>Something <span class="accent">is being built.</span></h1>

        <p>
            I'm working on improving this website.
            New projects, engineering work, and updates
            will be available here soon.
            Thanks for stopping by!
        </p>

        <a class="button" href="index.html">
            Return to Homepage
        </a>

        <footer>
            &copy; 2026 Connor Kline | Engineering Portfolio
        </footer>
    </main>
</body>
</html>
